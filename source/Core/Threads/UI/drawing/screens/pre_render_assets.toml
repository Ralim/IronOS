# pre_render_assets — defines the mirrored RAM buffers and a one-shot
# initialiser. The 96x16 and 128x32 versions use different loop bounds.
#
# NOTE: the 128x32 version in the existing C++ has a likely bug — it
# iterates `x < 56` but uses `(41 - x)` for the mirror index, which is
# the 96x16 mirror constant. Preserving the existing behaviour byte
# for byte until the maintainer chooses to fix it.

[file]
declarations = [
  "uint8_t buttonAF[sizeof(buttonA)];",
  "uint8_t buttonBF[sizeof(buttonB)];",
  "uint8_t disconnectedTipF[sizeof(disconnectedTip)];",
]

[[function]]
name = "ui_pre_render_assets"
args = ["void"]

# Generate the flipped screen into ram for later use
# (flipped is generated by flipping each row).

# ───── 96x16 ─────

[[function.body]]
for  = "int row = 0; row < 2; row++"
only = ["96x16"]

[[function.body.do]]
for = "int x = 0; x < 42; x++"

[[function.body.do.do]]
expr = "buttonAF[(row * 42) + x]         = buttonA[(row * 42) + (41 - x)]"

[[function.body.do.do]]
expr = "buttonBF[(row * 42) + x]         = buttonB[(row * 42) + (41 - x)]"

[[function.body.do.do]]
expr = "disconnectedTipF[(row * 42) + x] = disconnectedTip[(row * 42) + (41 - x)]"

# ───── 128x32 ─────

[[function.body]]
for  = "int row = 0; row < 4; row++"
only = ["128x32"]

[[function.body.do]]
for = "int x = 0; x < 56; x++"

[[function.body.do.do]]
expr = "buttonAF[(row * 56) + x]         = buttonA[(row * 56) + (41 - x)]"

[[function.body.do.do]]
expr = "buttonBF[(row * 56) + x]         = buttonB[(row * 56) + (41 - x)]"

[[function.body.do.do]]
expr = "disconnectedTipF[(row * 56) + x] = disconnectedTip[(row * 56) + (41 - x)]"
