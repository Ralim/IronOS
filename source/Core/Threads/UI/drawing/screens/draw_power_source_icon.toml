# draw_power_source_icon — significantly different per resolution:
# 96x16 uses small font + side stack only when V > 9; 128x32 always
# uses LARGE font and stacks at y=16.

[[function]]
name = "ui_draw_power_source_icon"
args = ["void"]

# ───── PD/QC/PD_EXT branch (non-DC inputs show voltage) ─────

[[function.body]]
features = ["#if defined(POW_PD) || defined(POW_QC) || defined(POW_PD_EXT)"]
cond     = true
[[function.body.branches]]
when = "!getIsPoweredByDCIN()"

# On non-DC inputs we replace this symbol with the voltage we are operating on.
# If <9V then show single digit, if not show dual small ones vertically stacked.
[[function.body.branches.do]]
local = "uint16_t V = getInputVoltageX10(getSettingValue(SettingsOptions::VoltageDiv), 0)"

[[function.body.branches.do]]
cond = true
[[function.body.branches.do.branches]]
when = "V % 10 >= 5"
# round up
[[function.body.branches.do.branches.do]]
target = "V"
value  = "(V / 10) + 1"
[[function.body.branches.do.branches]]
[[function.body.branches.do.branches.do]]
target = "V"
value  = "V / 10"

# 96x16: only stack when V > 9, otherwise one large digit
[[function.body.branches.do]]
only = ["96x16"]
cond = true
[[function.body.branches.do.branches]]
when = "V > 9"
[[function.body.branches.do.branches.do]]
local = "int16_t xPos = OLED::getCursorX()"
[[function.body.branches.do.branches.do]]
number = "V / 10"
places = 1
font   = "small"
[[function.body.branches.do.branches.do]]
expr = "OLED::setCursor(xPos, 8)"
[[function.body.branches.do.branches.do]]
number = "V % 10"
places = 1
font   = "small"
# need to reset this as if we drew a wide char
[[function.body.branches.do.branches.do]]
expr = "OLED::setCursor(xPos + 12, 0)"
[[function.body.branches.do.branches]]
[[function.body.branches.do.branches.do]]
number = "V"
places = 1
font   = "large"

# 128x32: always stack at y=16
[[function.body.branches.do]]
only  = ["128x32"]
local = "int16_t xPos = OLED::getCursorX()"
[[function.body.branches.do]]
only   = ["128x32"]
number = "V / 10"
places = 1
font   = "large"
[[function.body.branches.do]]
only = ["128x32"]
expr = "OLED::setCursor(xPos, 16)"
[[function.body.branches.do]]
only   = ["128x32"]
number = "V % 10"
places = 1
font   = "large"

[[function.body.branches.do]]
return = true

# ───── POW_DC branch (battery / DC logo) ─────

[[function.body]]
features = ["POW_DC"]
cond     = true
[[function.body.branches]]
when = "getSettingValue(SettingsOptions::MinDCVoltageCells)"

# User is on a lithium battery — calculate which of the 10 levels they are on.
[[function.body.branches.do]]
local = "uint8_t  cellCount = getSettingValue(SettingsOptions::MinDCVoltageCells) + 2"

[[function.body.branches.do]]
local = "uint32_t cellV     = getInputVoltageX10(getSettingValue(SettingsOptions::VoltageDiv), 0) / cellCount"

# Should give us approx cell voltage X10. Range is 42 -> Minimum voltage
# setting (systemSettings.minVoltageCells) = 9 steps, therefore we use battery 0-9.
[[function.body.branches.do]]
cond = true
[[function.body.branches.do.branches]]
when = "cellV < getSettingValue(SettingsOptions::MinVoltageCells)"
[[function.body.branches.do.branches.do]]
target = "cellV"
value  = "getSettingValue(SettingsOptions::MinVoltageCells)"

# Should leave us a number of 0-9
[[function.body.branches.do]]
expr = "cellV -= getSettingValue(SettingsOptions::MinVoltageCells)"

[[function.body.branches.do]]
cond = true
[[function.body.branches.do.branches]]
when = "cellV > 9"
[[function.body.branches.do.branches.do]]
target = "cellV"
value  = "9"

[[function.body.branches.do]]
battery = "cellV + 1"

[[function.body.branches]]
[[function.body.branches.do]]
# Draw the DC Logo
glyph = 15
